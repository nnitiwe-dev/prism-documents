appId: studio.prismdata.documents
productName: PRISM Documents
copyright: Copyright © 2026 Samuel Theophilus

# Update feed for electron-updater. GitHub Releases — no self-hosted server
# needed. Update owner/repo if the repository moves.
publish:
  provider: github
  owner: nnitiwe-dev
  repo: prism-documents

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.png
  - node_modules/**/*
  - "!**/*.map"
  - "!**/*.ts"

# The Python backend is bundled as a standalone binary built by
# scripts/build-backend.sh (PyInstaller). It is placed under the app's
# resources/backend directory, where sidecar.js looks for it in production.
extraResources:
  - from: ../backend/dist/prism-backend
    to: backend
    filter: ["**/*"]

mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  artifactName: PRISM-Documents-${version}-${arch}.${ext}

win:
  target: [nsis]
  artifactName: PRISM-Documents-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target: [AppImage]
  category: Office
  artifactName: PRISM-Documents-${version}-${arch}.${ext}
