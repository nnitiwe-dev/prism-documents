name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: |
          n=0
          until uv sync --extra dev; do
            n=$((n+1)); [ $n -ge 3 ] && echo "uv sync failed after 3 attempts" && exit 1
            echo "retry $n: clearing cache"; uv cache clean || true; sleep 10
          done

      - name: Lint
        run: uv run ruff check src

      - name: Test
        run: uv run pytest

  desktop:
    name: Desktop (install + syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check (main + renderer)
        run: |
          node --check src/main/main.js
          node --check src/main/sidecar.js
          node --check src/main/ipc.js
          node --check src/preload/preload.js
          for f in src/renderer/*.js; do
            cp "$f" "/tmp/$(basename "$f").mjs"
            node --check "/tmp/$(basename "$f").mjs"
          done
