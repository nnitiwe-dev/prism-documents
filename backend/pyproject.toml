[project]
name = "prism-backend"
version = "0.1.0"
description = "Local-first document intelligence backend for PRISM Documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Theophilus" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "pillow>=10.0",
]

[project.scripts]
prism-backend = "prism_backend.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
