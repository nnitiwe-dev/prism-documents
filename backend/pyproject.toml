[project]
name = "prism-backend"
version = "0.2.1"
description = "Local-first document intelligence backend for PRISM Documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Samuel Theophilus" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    # llama-cpp-python wheels are split by Mac arch: only 0.3.2 has a macOS
    # x86_64 (Intel) wheel, and only newer builds have macOS arm64. Pin per
    # platform so every target resolves to a version with a wheel.
    "llama-cpp-python==0.3.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llama-cpp-python==0.3.36 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
prism-backend = "prism_backend.__main__:main"

# llama-cpp-python ships prebuilt CPU wheels on its own index (avoids a source
# build). Pin it there so `uv sync` never tries to compile it.
[tool.uv]
# Ensure the lock has wheels for every target (both Mac arches especially).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Docling (layout + tables → Markdown/JSON) is installed as a separate runtime
# engine pack, NOT a locked dependency: it pulls PyTorch, and pinning it in the
# universal lock would cap torch to the oldest platform's version (Intel-Mac
# torch 2.2.2), breaking it everywhere. Install on a supported platform with:
#   uv pip install docling     (needs torch >= 2.4; no Intel-Mac wheels)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
